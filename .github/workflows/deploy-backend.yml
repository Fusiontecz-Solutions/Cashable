# Deploys the Cashable backend (cashable-be/) when it changes on main.
# Self-hosted runner on 46.202.160.243 (user fusiontecz-www-cashable, label cashable).
# Builds (npm install, prisma generate, tsc, asset copy) in the runner's work
# folder, then copies into backend/ and restarts pm2 "backend" (port 8043).
# .env and certificate files on the server are kept.
#
# NOT automatic: database schema changes. After changing prisma/schema, run by hand
# on the server:  cd ~/backend && npx prisma db push   (or a migration).
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['cashable-be/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cashable]
    env:
      APP_DIR: /home/fusiontecz-www-cashable/backend
      PM2_NAME: backend
      PORT: 8043
    defaults:
      run:
        working-directory: cashable-be
    steps:
      - name: Check the live folder
        working-directory: /tmp
        run: |
          [ -f "$APP_DIR/package.json" ] || { echo "No backend at $APP_DIR, stopping"; exit 1; }

      - uses: actions/checkout@v4

      - name: Use the site's Node (nvm)
        working-directory: /tmp
        run: |
          export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
          dirname "$(nvm which default)" >> "$GITHUB_PATH"

      # E-signature settings from GitHub (Settings → Secrets and variables → Actions), written into
      # the server's backend .env. Unset ones leave the .env as it is; the value `unset` removes the
      # line (e.g. SIGNING_PROVIDER=unset goes back to PearSign). Values are never printed.
      - name: Apply e-signature settings from GitHub
        working-directory: /tmp
        env:
          S_SIGNING_PROVIDER: ${{ vars.SIGNING_PROVIDER }}
          S_BOLDSIGN_SANDBOX: ${{ vars.BOLDSIGN_SANDBOX }}
          S_BOLDSIGN_API_KEY: ${{ secrets.BOLDSIGN_API_KEY }}
          S_BOLDSIGN_WEBHOOK_SECRET: ${{ secrets.BOLDSIGN_WEBHOOK_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const file = process.env.APP_DIR + "/.env";
            const names = ["SIGNING_PROVIDER", "BOLDSIGN_SANDBOX", "BOLDSIGN_API_KEY", "BOLDSIGN_WEBHOOK_SECRET"];
            let lines = fs.existsSync(file) ? fs.readFileSync(file, "utf8").split(/\r?\n/) : [];
            while (lines.length && lines[lines.length - 1] === "") lines.pop();
            const changed = [];
            for (const name of names) {
              const value = String(process.env["S_" + name] || "").trim();
              if (!value) continue;
              lines = lines.filter((l) => !new RegExp("^\\s*" + name + "\\s*=").test(l));
              if (value.toLowerCase() !== "unset") lines.push(name + "=" + value);
              changed.push(name + (value.toLowerCase() === "unset" ? " (removed)" : ""));
            }
            if (changed.length) {
              while (lines.length && lines[lines.length - 1] === "") lines.pop();
              fs.writeFileSync(file, lines.join("\n") + "\n");
            }
            console.log(changed.length ? "Updated in .env: " + changed.join(", ") : "No e-signature settings set in GitHub; .env unchanged.");
          '

      - name: Copy env files from the live folder
        run: |
          for f in .env .env.local .env.production; do
            if [ -f "$APP_DIR/$f" ]; then cp "$APP_DIR/$f" "$f"; fi
          done

      - name: Install and build
        run: npm run build

      - name: Go live
        run: |
          rsync -a --delete \
            --exclude '.env*' --exclude '*.pfx' --exclude '*.p12' --exclude '*.pem' \
            --exclude 'output.csv' --exclude 'uploads' \
            ./ "$APP_DIR/"
          pm2 restart "$PM2_NAME" --update-env
          pm2 save

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/" || true)
            echo "attempt $i: $code"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then exit 0; fi
          done
          echo "Backend not answering on port $PORT"; pm2 logs "$PM2_NAME" --lines 50 --nostream; exit 1
